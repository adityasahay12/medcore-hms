<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCore HMS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            text-align: center;
            padding: 50px 20px;
        }

        main {
            max-width: 650px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 18px #00000012;
        }

        h1 {
            color: #0f766e;
        }

        a {
            display: block;
            margin: 12px auto;
            padding: 13px;
            max-width: 300px;
            background: #0f766e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #115e59;
        }

        .status {
            color: #15803d;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <main>
        <h1>MedCore HMS</h1>
        <p>Cloud-Based Hospital Management System</p>
        <p class="status">Backend deployed on Render</p>
        <p>Java · Spring Boot · Spring Data JPA · TiDB</p>
        <h2>API Endpoints</h2>
        <a href="/api/patients">Patients API</a>
        <a href="/api/doctors">Doctors API</a>
        <a href="/api/appointments">Appointments API</a>
        <a href="/api/medical-records">Medical Records API</a>
        <p>Backend Internship Project</p>
    </main>
</body>

</html>
